<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Connessione assente · The Last Quest</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b12;color:#f7f5ef;font:16px/1.5 system-ui,sans-serif}.card{width:min(520px,calc(100% - 32px));box-sizing:border-box;padding:32px;border:1px solid #303044;border-radius:24px;background:#151520;text-align:center}h1{font-size:2.5rem;line-height:1;margin:.3em 0}p{color:#aaa8b5}.mark{font-size:3rem;color:#ffcc33}button{padding:12px 18px;border:0;border-radius:14px;background:#ffcc33;color:#111;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">⚡</div>
      <h1>Sei offline</h1>
      <p>Per sincronizzare missioni, punteggi e ricordi serve una connessione. I dati già aperti non vengono cancellati.</p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
